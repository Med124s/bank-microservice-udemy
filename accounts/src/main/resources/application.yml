server:
  port: 8080
spring:
  application:
    name: "accounts"
  profiles:
    active: "prod"
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: ''
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  config:
    #import:
    #  - "application_qa.yml"
    # - "application_prod.yml"
    import: "optional:configserver:http://localhost:8071/"
    #optional = إلا ما قدرش يتوصل بـ Config Server، ما يطيحش application

  #default parameter of rabbitMQ
  rabbitmq:
    host: "localhost"
    port: 5672
    username: "guest"
    password: "guest"

management:
  endpoints:
    web:
      exposure:
        include: "*"






