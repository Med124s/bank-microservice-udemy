server:
  port: 9000
spring:
  application:
    name: "cards"
  profiles:
    active: "prod"
  datasource:
    url: jdbc:mysql://localhost:3307/cardsdb
    username: root
    password: root
  jpa:
    show-sql: true
  sql:
    init:
      mode: always

  config:
    #import:
    #  - "application_qa.yml"
    # - "application_prod.yml"
    import: "optional:configserver:http://localhost:8071/"
    #optional = إلا ما قدرش يتوصل بـ Config Server، ما يطيحش application

management:
  endpoints:
    web:
      exposure:
        include: "*"