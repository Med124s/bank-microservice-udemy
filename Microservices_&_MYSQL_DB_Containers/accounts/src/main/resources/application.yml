server:
  port: 8080
spring:
  application:
    name: "accounts"
  profiles:
    active: "prod"
  datasource:
    url: jdbc:mysql://localhost:3306/accountsdb
    username: root
    password: root
  jpa:
    show-sql: true
    #شغّل سكريبتات SQL ديما (كل مرة كي démarri التطبيق)  (bon au niveaudev/test)
  sql:
    init:
      mode: always


  config:
    #import:
    #  - "application_qa.yml"
    # - "application_prod.yml"
    import: "optional:configserver:http://localhost:8071/"
    #optional = إلا ما قدرش يتوصل بـ Config Server، ما يطيحش application


management:
  endpoints:
    web:
      exposure:
        include: "*"






